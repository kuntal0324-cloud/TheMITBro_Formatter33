name: M33 OCR Pipeline
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_milestone33_ocr.py tests/test_milestone33_router.py tests/test_milestone33_duplicate.py tests/test_milestone33_catalog.py
