name: M33 OCR Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify repository structure
        run: |
          pwd
          ls -la
          test -d src
          test -d tests

      - name: Run M33 tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_milestone33_ocr.py \
            tests/test_milestone33_router.py \
            tests/test_milestone33_duplicate.py \
            tests/test_milestone33_catalog.py
